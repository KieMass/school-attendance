name: Deploy

# Manual trigger only — wire this up to your chosen cloud once infrastructure
# exists (see docs/DEPLOYMENT.md). Provided as a ready-to-fill template for
# both Azure and AWS container targets; delete whichever branch you don't
# use once you commit to one.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/api
  IMAGE_WEB: ${{ github.repository }}/web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_API }}:latest

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ github.sha }},${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:latest

  # --- Option A: Azure Web App for Containers -------------------------------
  deploy-azure:
    if: false # flip to `true` (and remove deploy-aws) once Azure is your target
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: pcls-api-${{ inputs.environment }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:${{ github.sha }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: pcls-web-${{ inputs.environment }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ github.sha }}

  # --- Option B: AWS ECS (Fargate) ------------------------------------------
  deploy-aws:
    if: false # flip to `true` (and remove deploy-azure) once AWS is your target
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Force new ECS deployment (API)
        run: |
          aws ecs update-service --cluster pcls-${{ inputs.environment }} \
            --service pcls-api --force-new-deployment
      - name: Force new ECS deployment (Web)
        run: |
          aws ecs update-service --cluster pcls-${{ inputs.environment }} \
            --service pcls-web --force-new-deployment
