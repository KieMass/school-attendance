# Render Blueprint — deploys the NestJS API as a Docker web service.
# https://render.com/docs/blueprint-spec
#
# Usage: in the Render dashboard, New > Blueprint, connect this repo, and
# Render will read this file automatically. Vars marked `sync: false` are
# left blank for you to fill in on the dashboard (secrets shouldn't live in
# a committed file); vars marked `generateValue: true` are generated by
# Render itself at first deploy.

services:
  - type: web
    name: pcls-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        sync: false # paste your Neon/Supabase connection string
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: QR_ENCRYPTION_KEY
        sync: false # must be base64 for exactly 32 bytes — see docs/DEPLOYMENT.md
      - key: QR_DEFAULT_VALIDITY_MINUTES
        value: '120'
      - key: BCRYPT_SALT_ROUNDS
        value: '12'
      - key: CORS_ORIGINS
        sync: false # your Vercel URL(s), comma-separated, once known
      - key: THROTTLE_TTL
        value: '60'
      - key: THROTTLE_LIMIT
        value: '100'
      # Optional — leave blank to keep notifications in dev-log mode:
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
